name: Aperture CI

on:
  push:
    branches: [main]
    paths: ["aperture/**"]
  pull_request:
    branches: [main]
    paths: ["aperture/**"]

defaults:
  run:
    working-directory: aperture

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: aperture/package-lock.json

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run cli -- run --topic "CI smoke test topic" --offline
